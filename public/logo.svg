<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Box icon -->
  <g transform="translate(0,4)">
    <!-- Box bottom -->
    <polygon points="20,38 4,29 4,15 20,24" fill="#15803D"/>
    <!-- Box top face -->
    <polygon points="20,24 4,15 20,6 36,15" fill="#16A34A"/>
    <!-- Box right face -->
    <polygon points="20,38 36,29 36,15 20,24" fill="#F97316"/>
    <!-- Leaf accent on top -->
    <ellipse cx="20" cy="10" rx="5" ry="3" fill="#4ADE80" opacity="0.9" transform="rotate(-20,20,10)"/>
  </g>
  <!-- Brand name -->
  <text x="46" y="32" font-family="'DM Sans', sans-serif" font-weight="700" font-size="18" fill="#111827">Box</text>
  <text x="80" y="32" font-family="'DM Sans', sans-serif" font-weight="700" font-size="18" fill="#16A34A">Ni</text>
  <text x="100" y="32" font-family="'DM Sans', sans-serif" font-weight="700" font-size="18" fill="#111827">Juan</text>
  <text x="146" y="32" font-family="'DM Sans', sans-serif" font-weight="700" font-size="18" fill="#F97316">PH</text>
</svg>
